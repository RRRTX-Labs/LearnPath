  <circle cx="15" cy="45" r="3.5" fill="#2DD4BF"/>
  <circle cx="49" cy="22" r="9" fill="none" stroke="#F5B942" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="49" cy="22" r="5.5" fill="#F5B942"/>
</svg>
